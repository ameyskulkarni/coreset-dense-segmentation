# The proxy training recipe (ADR 0001, epoch-based) for ADE20K method comparisons. Tune ONCE
# on the full dataset only; freeze and reuse identically across every selection method,
# ratio, and seed.
#
# `epochs: 100` and `warmup_epochs: 6` match cityscapes_proxy exactly (warmup = 6% of the
# schedule), so the two datasets differ only in dataset-calibrated values (lr) and the
# dataset itself. (The earlier value, 8 epochs, only matched an old fixed 20k-iteration
# budget and had no measured basis.) 100 epochs on full ADE20K (20,210 imgs / batch 8 =
# 2,526 steps/epoch) is 252,600 steps. MEASURED throughput on one RTX 3090 (SegFormer-B0,
# 512x512 crops, AMP, 8 workers, 2026-10-23 benchmark): batch 8 = 114 ms/step ~ 254k
# imgs/h, so one full run is ~8 GPU-hours of training plus evals; a ratio-r subset run is
# ~8r hours.
#
# `batch_size: 8` = cityscapes_proxy. Batch 16 was measured at 262k imgs/h (~3% faster per
# epoch), so it would save no meaningful time, and under epoch-based training it would halve
# the number of optimizer steps, which matters most for small subsets.
#
# `lr: 6.0e-5` FROZEN (2026-10-24) via the LR sweep in scripts/experiments/run_ade20k.sh,
# full data, 100 epochs, seed 0 (runs ade_lrsweep_lr{6e-5,1e-4,2e-4}_full_s0):
#   lr=6e-5 -> mIoU 36.25%, rare_class_miou (K=38) 28.76%  <- winner on mIoU and rare mIoU
#   lr=1e-4 -> mIoU 36.06%, rare_class_miou 28.43%
#   lr=2e-4 -> mIoU 35.96%, rare_class_miou 28.18%
# Unlike Cityscapes (1e-4 won by 1.35 mIoU) the curve is FLAT: 0.29 mIoU spread, likely
# within seed noise; pixel acc / boundary F lean the other way (2e-4 best). Full ADE20K is
# 252.6k steps vs Cityscapes' 37.1k, so a higher LR has no step deficit to make up. The pick
# follows the rule fixed before the sweep (best final mIoU). One AdamW param group, so this
# equals mmseg's SegFormer base LR but WITHOUT its 10x decode-head multiplier / no-decay norms.
name: ade20k_proxy
epochs: 100
warmup_epochs: 6
batch_size: 8
optimizer: adamw
lr: 6.0e-5
weight_decay: 0.01
lr_schedule: poly
poly_power: 1.0
min_lr: 0.0
warmup_ratio: 1.0e-6
precision: amp_fp16
grad_clip_norm: null
num_workers: 8
seed_train: 0
eval_every_epochs: 5 # periodic in-training eval (fast, whole-image, 100-image subsample); = cityscapes_proxy
eval_max_images: 100
eval_resize_short_side: 512
save_every_epochs: 5
log_every: 50
