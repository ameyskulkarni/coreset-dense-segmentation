# The frozen proxy training recipe (§4, ADR 0001 — docs/adr/0001-epoch-based-training.md,
# see the amendments for the epoch-count and schedule history) for Cityscapes method
# comparisons. Tune ONCE on the full dataset only (§9); freeze and reuse identically
# across every selection method, ratio, and seed — the only thing that may vary is which
# images are in the subset, and (deliberately, per the ADR) the resulting wall-clock time.
#
# `epochs` replaces the old iteration cap: every run trains for this many passes over
# whatever subset it was given, so a 10% subset does ~10% of the full run's gradient
# steps — the compute savings ARE a reported result now, not a confound held fixed.
# 100 epochs on full Cityscapes (2975 imgs / batch 8 = 371 steps/epoch) is 37,100 steps —
# MEASURED at 1.34 GPU-hours on a single RTX 3090 (see the run
# cityscapes_segformer_b0_full_r1.0_s0_5f5b8a21cd4b in results/runs.csv, mIoU=71.21%),
# not an estimate. This value was tested via `--set recipe.epochs=100` before being
# frozen here so future runs don't need the override.
#
# LR schedule is `poly` (power 1.0 = linear decay to zero) — this is the literature-
# standard SegFormer/mmseg fine-tuning schedule, not a "fancy" choice (power=1.0 is just
# a straight line, no more complex than `cosine`).
#
# `lr: 1.0e-4` (not the literature-default 6e-5) — EMPIRICALLY chosen via the LR sweep in
# scripts/run_cityscapes_calibration.sh, full data, 100 epochs, seed 0:
#   lr=3e-5 -> mIoU 68.78%, rare_class_miou 54.86%
#   lr=6e-5 -> mIoU 71.43%, rare_class_miou 59.93%
#   lr=1e-4 -> mIoU 72.78%, rare_class_miou 62.68%  <- winner, every metric, clean margin
# Margins (~1.3-4 mIoU points) are far outside the measured reproducibility noise floor
# (~0.02 mIoU points between two identical reruns at lr=3e-5) — not noise. See
# results/runs.csv rows cs_lrsweep_lr{3e-5,6e-5,1e-4}_full_s0 for the full numbers.
name: cityscapes_proxy
epochs: 100
warmup_epochs: 6 # 6% of the schedule — ~2,226 steps, close to the SegFormer/mmseg
                 # convention's fixed absolute warmup_iters=1500
batch_size: 8
optimizer: adamw
lr: 1.0e-4
weight_decay: 0.01
lr_schedule: poly # poly | cosine | constant — see docs/adr/0001-epoch-based-training.md
poly_power: 1.0
min_lr: 0.0 # decays fully to 0 by the end of training
warmup_ratio: 1.0e-6 # linear warmup starts at base_lr * warmup_ratio
precision: amp_fp16
grad_clip_norm: null
num_workers: 8
seed_train: 0 # RNG init/order seed; override with --seed at the CLI
eval_every_epochs: 5 # periodic in-training eval (fast, whole-image, subsampled — see eval_max_images)
eval_max_images: 100
eval_resize_short_side: 512
save_every_epochs: 5
log_every: 50 # step-count logging cadence (loss smoothing window) — NOT a schedule/length
              # parameter; the one place a raw step count is still the natural unit.
