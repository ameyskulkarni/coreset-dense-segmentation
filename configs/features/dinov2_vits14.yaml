# DINOv2 ViT-S/14 (384-dim) — smallest variant, the plan's original §6 choice. The project
# default is now dinov2_vitb14 (see 00_extract_features.py); `patch_coverage` and the
# global-embedding baselines read from whichever features config you extract.
# Downloaded automatically via torch.hub on first use (facebookresearch/dinov2).
name: dinov2_vits14
backend: dinov2
model_name: dinov2_vits14
source: torch_hub
hub_repo: facebookresearch/dinov2
patch_size: 14
outputs: [cls, patch]
image_size: 518 # multiple of patch_size (14 * 37)
batch_size: 32
